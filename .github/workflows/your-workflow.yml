name: Build MYRA APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if uploaded as a zip)
        run: |
          mkdir -p _proj
          find . -maxdepth 1 -name "*.zip" -print0 | while IFS= read -r -d '' Z; do
            echo "Unzipping: $Z"
            unzip -q -o "$Z" -d _proj
          done

      - name: Find project folder
        id: proj
        run: |
          G=$(find . -name gradlew -not -path "./.git/*" | head -1)
          if [ -z "$G" ]; then
            echo "gradlew paoa jay nai. Repo-te ei file gulo ache:"
            find . -maxdepth 2 -not -path "./.git/*" | head -60
            exit 1
          fi
          DIR=$(dirname "$G")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          rm -f "$DIR/local.properties"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        working-directory: ${{ steps.proj.outputs.dir }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-5.2.67-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
